<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Absensi Discord</title>
    <!-- Tailwind CSS untuk Styling Modern -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK v9 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, addTimestamp, addDoc, getDocs, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDkxh4PBYrMv4xOwpXMsXtxZh87AwkPc2s",
            authDomain: "absensi-245eb.firebaseapp.com",
            projectId: "absensi-245eb",
            storageBucket: "absensi-245eb.firebasestorage.app",
            messagingSenderId: "1065682585954",
            appId: "1:1065682585954:web:6f2f681d24bbd556ca843b",
            measurementId: "G-RTHG8E54JX"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Simpan ke Global supaya bisa dipanggil fungsi lain
        window.db = db;
        window.collection = collection;
        window.addDoc = addDoc;
        window.getDocs = getDocs;
        window.query = query;
        window.orderBy = orderBy;
        window.serverTimestamp = serverTimestamp;
    </script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen p-4 sm:p-6">

    <div class="max-w-4xl mx-auto space-y-6">
        <!-- Header -->
        <header class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-indigo-400">🤖 Dashboard Absensi Discord</h1>
                <p class="text-sm text-slate-400">Rekap otomatis reaksi absensi & avatar anggota ke Firebase.</p>
            </div>
            <div id="statusBadge" class="px-3 py-1 bg-amber-500/10 text-amber-400 border border-amber-500/20 text-xs rounded-full font-medium">
                Status: Menunggu Input
            </div>
        </header>

        <!-- Form Konfigurasi -->
        <section class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-xl space-y-4">
            <h2 class="text-lg font-semibold text-slate-200">Pengaturan Bot & Channel</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Bot Token</label>
                    <input type="password" id="botToken" value="MTU2MzE3MTc2NDIyMDA3MjA5Ng.GhBImC.ZtYxPU0I5KZMPfVB7B_rbuSUKh_TPqhmZ7L99Y" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">ID Channel Absensi</label>
                    <input type="text" id="channelId" placeholder="Contoh: 123456789012345678" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
                </div>
            </div>
            <div class="flex flex-wrap gap-3 pt-2">
                <button id="btnFetch" onclick="tarikAbsensi()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 active:scale-95 transition text-white font-medium py-2.5 px-4 rounded-lg text-sm shadow-lg flex items-center justify-center gap-2">
                    📥 Tarik & Rekap Absensi
                </button>
                <button id="btnSave" onclick="simpanKeFirestore()" class="bg-emerald-600 hover:bg-emerald-500 active:scale-95 transition text-white font-medium py-2.5 px-4 rounded-lg text-sm shadow-lg flex items-center justify-center gap-2">
                    💾 Simpan ke Firestore
                </button>
            </div>
        </section>

        <!-- Tabel Rekap Data -->
        <section class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-xl space-y-4">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                <h2 class="text-lg font-semibold text-slate-200">Data Kehadiran Hari Ini</h2>
                <input type="text" id="searchBox" onkeyup="filterTabel()" placeholder="Cari nama anggota..." class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500 w-full sm:w-64">
            </div>

            <div class="overflow-x-auto rounded-lg border border-slate-700">
                <table id="tabelAbsensi" class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-900/50 text-slate-400 text-xs uppercase tracking-wider">
                            <th class="p-3">Avatar</th>
                            <th class="p-3">Nama Anggota</th>
                            <th class="p-3">Emoji Reaksi</th>
                            <th class="p-3">Waktu Absen</th>
                        </tr>
                    </thead>
                    <tbody id="tabelBody" class="divide-y divide-slate-700 text-sm text-slate-300">
                        <tr>
                            <td colspan="4" class="p-6 text-center text-slate-500">Belum ada data. Silakan masukkan Channel ID lalu klik Tarik Absensi.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <!-- Script Utama -->
    <script>
        // Load data tersimpan di browser
        window.onload = function() {
            if(localStorage.getItem('saved_channel')) {
                document.getElementById('channelId').value = localStorage.getItem('saved_channel');
            }
        }

        let currentData = [];

        async function tarikAbsensi() {
            const token = document.getElementById('botToken').value.trim();
            const channelId = document.getElementById('channelId').value.trim();
            const badge = document.getElementById('statusBadge');
            const btn = document.getElementById('btnFetch');

            if(!token || !channelId) {
                alert('Bot Token dan Channel ID wajib diisi!');
                return;
            }

            localStorage.setItem('saved_channel', channelId);
            badge.className = "px-3 py-1 bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 text-xs rounded-full font-medium animate-pulse";
            badge.innerText = "Status: Mengambil data dari Discord...";
            btn.disabled = true;

            try {
                // Menggunakan proxy cors publicly available untuk bypass CORS browser
                const proxyUrl = `https://corsproxy.io/?` + encodeURIComponent(`https://discord.com/api/v10/channels/${channelId}/messages?limit=15`);
                
                const response = await fetch(proxyUrl, {
                    headers: { 'Authorization': `Bot ${token}` }
                });

                if(!response.ok) throw new Error(`Gagal mengambil pesan (Error ${response.status}). Cek kembali Channel ID & izin bot!`);

                const messages = await response.json();
                let listAbsen = [];
                let checkedUsers = new Set();

                for (const msg of messages) {
                    if (msg.reactions) {
                        for (const rx of msg.reactions) {
                            const emojiParam = rx.emoji.id ? `${rx.emoji.name}:${rx.emoji.id}` : encodeURIComponent(rx.emoji.name);
                            const rxProxyUrl = `https://corsproxy.io/?` + encodeURIComponent(`https://discord.com/api/v10/channels/${channelId}/messages/${msg.id}/reactions/${emojiParam}`);
                            
                            const rxRes = await fetch(rxProxyUrl, {
                                headers: { 'Authorization': `Bot ${token}` }
                            });

                            if(rxRes.ok) {
                                const users = await rxRes.json();
                                for (const user of users) {
                                    if(!user.bot && !checkedUsers.has(user.id)) {
                                        checkedUsers.add(user.id);
                                        const avatarUrl = user.avatar 
                                            ? `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png`
                                            : `https://cdn.discordapp.com/embed/avatars/0.png`;

                                        listAbsen.push({
                                            userId: user.id,
                                            username: user.global_name || user.username,
                                            avatar: avatarUrl,
                                            emoji: rx.emoji.name,
                                            timestamp: new Date(msg.timestamp).toLocaleString('id-ID')
                                        });
                                    }
                                }
                            }
                        }
                    }
                }

                currentData = listAbsen;
                renderTabel(currentData);
                badge.className = "px-3 py-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-xs rounded-full font-medium";
                badge.innerText = `Status: Berhasil (${currentData.length} data ditemukan)`;

            } catch (err) {
                console.error(err);
                badge.className = "px-3 py-1 bg-rose-500/10 text-rose-400 border border-rose-500/20 text-xs rounded-full font-medium";
                badge.innerText = "Status: Gagal (Cek CORS / Koneksi)";
                alert('Gagal mengambil data: ' + err.message);
            } finally {
                btn.disabled = false;
            }
        }

        function renderTabel(data) {
            const tbody = document.getElementById('tabelBody');
            if(data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-6 text-center text-slate-500">Tidak ada reaksi ditemukan pada pesan terakhir di channel ini.</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map(item => `
                <tr class="hover:bg-slate-700/30 transition">
                    <td class="p-3">
                        <img src="${item.avatar}" alt="Avatar" class="w-10 h-10 rounded-full bg-slate-700 object-cover">
                    </td>
                    <td class="p-3 font-medium text-slate-200">${item.username}</td>
                    <td class="p-3 text-lg">${item.emoji}</td>
                    <td class="p-3 text-xs text-slate-400">${item.timestamp}</td>
                </tr>
            `).join('');
        }

        function filterTabel() {
            const keyword = document.getElementById('searchBox').value.toLowerCase();
            const filtered = currentData.filter(item => item.username.toLowerCase().includes(keyword));
            renderTabel(filtered);
        }

        async function simpanKeFirestore() {
            if(currentData.length === 0) {
                alert('Belum ada data absensi untuk disimpan!');
                return;
            }

            try {
                const batchCol = window.collection(window.db, "rekap_absensi");
                await window.addDoc(batchCol, {
                    tanggal: new Date().toISOString().split('T')[0],
                    totalHadir: currentData.length,
                    dataAnggota: currentData,
                    createdAt: window.serverTimestamp()
                });
                alert('Sukses! Data absensi berhasil disimpan ke Firebase Firestore.');
            } catch (e) {
                console.error(e);
                alert('Gagal menyimpan ke Firestore: ' + e.message);
            }
        }
    </script>
</body>
</html>
